<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elige tu despensa · HondaDespensa</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #fff1ce; background: #071c32 url("textura-azul.svg"); font-family: Georgia, serif; }
main { max-width: 630px; margin: auto; padding: 20px 16px 36px; }
header { display: grid; grid-template-columns: 40% 1fr; align-items: center; gap: 16px; }
img { display: block; width: 100%; height: auto; }
h1 { text-align: center; font-size: clamp(24px, 6vw, 36px); }
p { line-height: 1.5; }
.demo { text-align: center; color: #b9d2e3; font: 14px system-ui, sans-serif; }
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid #ffdda2; outline-offset: 3px; }
.card { width: 100%; display: grid; grid-template-columns: minmax(76px, 29%) 1fr auto; align-items: center; gap: 12px; text-align: left; border: 1px solid #76a4c1; border-radius: 19px; padding: 9px 13px; margin: 0 0 13px; background: #0b2940; }
.card strong { display: block; font-size: clamp(17px, 4.9vw, 28px); overflow-wrap: anywhere; }
.card small { display: block; margin-top: 5px; color: #c4d9e6; font-style: italic; }
.card span[aria-hidden] { font-size: 25px; }
.action { padding: 11px 16px; border: 1px solid #76a4c1; border-radius: 12px; background: #0b2940; }
#create { display: block; margin: 19px auto 0; }
dialog { max-width: min(360px, 90vw); border: 1px solid #76a4c1; border-radius: 16px; background: #102c42; color: inherit; }
dialog::backdrop { background: #0009; }
input { display: block; width: 100%; margin: 7px 0 14px; padding: 9px; }
</style>
</head>

<main>

<section id="chooser" aria-labelledby="title">

  <button type="button" id="create" class="action">+ Crear despensa</button>
</section>
<section id="opened" hidden>
  <h1 id="openedName" tabindex="-1"></h1>
  <p>Has abierto esta despensa en la vista de prueba.</p>
  <button type="button" id="back" class="action">Cambiar de despensa</button>
</section>
<dialog id="newPantry">

    <label>Nombre de la despensa<input name="name" maxlength="60" required></label>
    <button class="action">Crear</button>
    <button type="button" id="cancel" class="action">Cancelar</button>
  </form>
</dialog>
</main>

function openPantry(name) {
  openedName.textContent = name;
  chooser.hidden = true;
  opened.hidden = false;
  openedName.focus();
}

function addCard(name, access, illustration) {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.innerHTML = '<img alt=""><span><strong></strong><small></small></span><span aria-hidden="true">›</span>';
  card.querySelector('img').src = artwork[illustration];
  card.querySelector('strong').textContent = name;
  card.querySelector('small').textContent = access;
  card.addEventListener('click', () => openPantry(name));
  list.append(card);
}

addCard('Playa Honda', 'Compartida', 'beach');
addCard('Casa principal', 'Personal', 'home');
document.getElementById('back').onclick = () => {
  opened.hidden = true;
  chooser.hidden = false;
  document.getElementById('title').focus();
};
document.getElementById('create').onclick = () => dialog.showModal();
document.getElementById('cancel').onclick = () => dialog.close();
form.onsubmit = event => {
  event.preventDefault();
  const name = form.elements.name.value.trim();
  if (!name) return;
  addCard(name, 'Personal', 'home');
  form.reset();
  dialog.close();
  openPantry(name);
};
</script>
