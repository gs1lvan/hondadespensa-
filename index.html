'🐟 Pescados y mariscos en conserva':['Atún en aceite','Sardinas en aceite','Caballa en conserva','Melva en conserva','Mejillones en escabeche','Berberechos al natural','Almejas en conserva','Anchoas en aceite','Calamares en conserva','Pulpo en conserva'],
'🥩 Carnes y platos preparados':['Paté en lata esterilizado','Albóndigas en lata','Fabada en conserva','Cocido madrileño en conserva','Callos en conserva','Lentejas preparadas','Garbanzos con espinacas','Sopas en lata','Cremas de verduras en brick','Caldos en brick'],
'🥕 Verduras y encurtidos':['Maíz dulce en conserva','Guisantes en conserva','Judías verdes en conserva','Zanahorias en conserva','Espárragos en conserva','Pimientos asados en conserva','Champiñones en conserva','Alcachofas en conserva','Aceitunas','Pepinillos en vinagre','Cebollitas en vinagre','Remolacha en conserva','Tomates secos envasados','Verduras deshidratadas'],
'🥜 Frutos secos y aperitivos':['Almendras','Nueces','Avellanas','Cacahuetes tostados','Pistachos','Anacardos','Semillas de calabaza','Semillas de girasol','Semillas de chía','Semillas de sésamo','Crema de cacahuete','Barritas proteicas','Patatas fritas de bolsa','Maíz para palomitas','Fruta deshidratada'],
'🍞 Harinas y repostería':['Harina de trigo blanca','Harina de maíz','Pan rallado','Azúcar blanco','Azúcar moreno','Levadura química','Levadura seca de panadería','Bicarbonato','Gelatina en polvo','Cacao puro en polvo','Coco rallado','Esencia de vainilla','Sirope de chocolate'],
'🧃 Bebidas y suplementos':['Agua mineral','Refrescos en lata','Bebidas isotónicas']};
const URL='https://yqumpnoxmzkmnxnjrkjl.supabase.co';
const PUBLIC_KEY='sb_publishable_WcQCzIlbBTktSMzva2qsQw_VnwYD4Aq';
const KEY='despensa_segunda_vivienda_v1';
const db=createClient(URL,PUBLIC_KEY);
const $=id=>document.getElementById(id);
const THEME_KEY='hondadespensa_visualizacion';
function setDarkMode(on){document.documentElement.classList.toggle('dark',on);$('darkTheme').checked=on;localStorage.setItem(THEME_KEY,on?'dark':'light');}
$('darkTheme').addEventListener('change',e=>setDarkMode(e.target.checked));
setDarkMode(localStorage.getItem(THEME_KEY)==='dark');
const openCategories=new Set();
const esCompare=(a,b)=>a.localeCompare(b,'es',{sensitivity:'base',numeric:true});
function renderGroupedAdmin(container,rows,type,query){
 container.replaceChildren();
 const groups=new Map();
 for(const item of rows){
  const category=type==='food'?item.category:item.categoria;
  const name=type==='food'?item.name:item.nombre;
  if(!(name+' '+category).toLocaleLowerCase('es').includes(query))continue;
  if(!groups.has(category))groups.set(category,[]);
  groups.get(category).push(item);
 }
 for(const category of [...groups.keys()].sort(esCompare)){
  const section=document.createElement('details');section.className='category admin-category';
  const summary=document.createElement('summary');
  const heading=document.createElement('span');heading.textContent=category;
  const count=document.createElement('small');count.textContent=groups.get(category).length+' alimentos';
  summary.append(heading,count);section.append(summary);
  for(const item of groups.get(category).sort((a,b)=>esCompare(type==='food'?a.name:a.nombre,type==='food'?b.name:b.nombre)))section.append(makeAdminRow(item,type));
  if(query)section.open=true;
  container.append(section);
 }
 if(!groups.size){const p=document.createElement('p');p.className='empty';p.textContent='No hay alimentos con este filtro.';container.append(p)}
}

let data=[],session=null,channel=null,busy=false,catalogRows=[],catalogReady=false,adminMode=false;
const categoryOptions=()=>[...new Set([...Object.keys(initial),...data.map(x=>x.category),...catalogRows.map(x=>x.categoria)])];
function adminMessage(t){$('adminMessage').textContent=t||'';}

function localItems(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))return saved}catch{}return Object.entries(initial).flatMap(([category,names])=>names.map(name=>({id:crypto.randomUUID(),category,name,have:false})));}
function setStatus(message){$('status').textContent=message;}
function showApp(visible){if(!visible)adminMode=false;$('adminToggle').hidden=!visible;$('visualization').hidden=!visible;$('adminToggle').textContent=adminMode?'← Volver a despensa':'⚙️ Administrar';$('adminPanel').hidden=!visible||!adminMode;for(const id of ['stats','toolbar','items'])$(id).hidden=!visible||adminMode;$('addForm').hidden=!visible||!adminMode; $('loginForm').hidden=visible;$('logged').hidden=!visible;$('status').hidden=visible;if(!visible)$('migration').hidden=true;}
function categories(){const sel=$('newCategory'),old=sel.value;sel.replaceChildren();for(const c of categoryOptions().sort(esCompare)){const o=document.createElement('option');o.value=c;o.textContent=c;sel.append(o)}if(old&&[...sel.options].some(x=>x.value===old))sel.value=old;}
function render(){const q=$('search').value.trim().toLocaleLowerCase('es'),f=$('filter').value;$('total').textContent=data.length;$('have').textContent=data.filter(x=>x.have).length;$('missing').textContent=data.filter(x=>!x.have).length;const shown=data.filter(x=>x.name.toLocaleLowerCase('es').includes(q)&&(f==='all'||(f==='have'?x.have:!x.have)));const main=$('items');main.replaceChildren();if(!shown.length){const p=document.createElement('p');p.className='empty';p.textContent='No hay alimentos con este filtro.';main.append(p)}for(const category of [...new Set(data.map(x=>x.category))].sort(esCompare)){const arr=shown.filter(x=>x.category===category).sort((a,b)=>esCompare(a.name,b.name));if(!arr.length)continue;const section=document.createElement('details');section.className='category';section.open=openCategories.has(category);section.addEventListener('toggle',()=>{if(section.open)openCategories.add(category);else openCategories.delete(category)});const h=document.createElement('summary');const title=document.createElement('span');title.textContent=category;h.append(title);const count=document.createElement('small');count.textContent=`${arr.filter(x=>x.have).length}/${arr.length}`;h.append(count);section.append(h);for(const x of arr){const row=document.createElement('div');row.className='item'+(x.have?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=x.have;check.disabled=busy;check.setAttribute('aria-label','Tengo '+x.name);check.onchange=async()=>{check.disabled=true;const {error}=await db.from('alimentos').update({disponible:check.checked}).eq('id',x.id);if(error)alert('No se pudo guardar: '+error.message);await refresh();};const span=document.createElement('span');span.textContent=x.name;row.append(check,span);section.append(row)}main.append(section)}categories();if(adminMode)renderAdmin();}
async function refresh(){if(!session)return;const {data:rows,error}=await db.from('alimentos').select('id,nombre,categoria,disponible').order('creado_en',{ascending:true});if(error){setStatus('Sin conexión o sin permisos: '+error.message);return;}data=rows.map(x=>({id:x.id,name:x.nombre,category:x.categoria,have:x.disponible}));render();setStatus('☁️ Lista compartida · '+data.length+' alimentos · Sincronizada');$('migration').hidden=data.length!==0;}
async function signedIn(s){session=s;showApp(!!s);if(s){const user=s.user||{};const name=user.user_metadata?.display_name||user.user_metadata?.full_name||user.email?.split('@')[0]||'Usuario';$('currentUser').textContent='👤 '+name;$('headerUser').textContent='👤 '+name;$('headerUser').hidden=false;}else{$('currentUser').textContent='';$('headerUser').textContent='';$('headerUser').hidden=true;}if(channel){await db.removeChannel(channel);channel=null;}if(!s){setStatus('Inicia sesión con tu cuenta de HondaDespensa.');return;}setStatus('Cargando lista compartida…');await refresh();await loadCatalog();channel=db.channel('alimentos-honda').on('postgres_changes',{event:'*',schema:'public',table:'alimentos'},()=>refresh()).subscribe();}
$('loginForm').onsubmit=async e=>{e.preventDefault();const button=$('loginForm').querySelector('button');button.disabled=true;setStatus('Iniciando sesión…');const {data:result,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});button.disabled=false;if(error){setStatus('Error de acceso: '+error.message);return;}$('password').value='';await signedIn(result.session);};
$('logout').onclick=async()=>{await db.auth.signOut();await signedIn(null);};
$('upload').onclick=async()=>{if(busy)return;const {count,error:countError}=await db.from('alimentos').select('id',{count:'exact',head:true});if(countError){alert(countError.message);return;}if(count!==0){alert('La nube ya contiene alimentos. No se importará otra lista.');await refresh();return;}const local=localItems();if(!confirm(`Vas a subir ${local.length} alimentos desde ESTE móvil. Hazlo solo desde el móvil con la lista correcta. ¿Continuar?`))return;busy=true;$('upload').disabled=true;const rows=local.map(x=>({id:x.id,nombre:x.name,categoria:x.category,disponible:!!x.have}));for(let i=0;i<rows.length;i+=100){const {error}=await db.from('alimentos').insert(rows.slice(i,i+100));if(error){alert('Error al importar: '+error.message+'; algunos productos podrían haberse subido. No repitas la importación sin revisar la nube.');break;}}busy=false;$('upload').disabled=false;await refresh();};

const catalogOpen=new Set();
async function addSharedFood(name,category){
 if(!session)return;
 if(data.some(x=>x.name.toLocaleLowerCase('es')===name.toLocaleLowerCase('es')&&x.category===category)){alert('Ese alimento ya está en la lista.');return;}
 const {error}=await db.from('alimentos').insert({nombre:name,categoria:category,disponible:false});
 if(error){alert('No se pudo añadir: '+error.message);return;}
 await refresh();
}
function renderCatalog(){
 const holder=$('catalogItems');if(!holder)return;
 const q=$('catalogSearch').value.trim().toLocaleLowerCase('es');
 holder.replaceChildren();let remaining=0;
 for(const [category,names] of (catalogReady?Object.entries(catalogRows.reduce((acc,x)=>{(acc[x.categoria]??=[]).push(x.nombre);return acc},{})):Object.entries(initial)).sort((a,b)=>esCompare(a[0],b[0]))){
  const available=names.filter(name=>!data.some(x=>x.category===category&&x.name.toLocaleLowerCase('es')===name.toLocaleLowerCase('es'))&&name.toLocaleLowerCase('es').includes(q));
  if(!available.length)continue;
  remaining+=available.length;
  const details=document.createElement('details');details.className='catalog-category';details.open=catalogOpen.has(category)||!!q;
  details.addEventListener('toggle',()=>{if(details.open)catalogOpen.add(category);else catalogOpen.delete(category)});
  const summary=document.createElement('summary');summary.textContent=category+' · '+available.length;details.append(summary);
  const products=document.createElement('div');products.className='catalog-products';
  for(const name of available){const button=document.createElement('button');button.type='button';button.textContent='＋ '+name;button.onclick=async()=>{button.disabled=true;await addSharedFood(name,category)};products.append(button)}
  details.append(products);holder.append(details);
 }
 if(!remaining){const p=document.createElement('p');p.className='catalog-empty';p.textContent=q?'No hay alimentos disponibles con esa búsqueda.':'Ya habéis añadido todos los alimentos del catálogo.';holder.append(p)}
}

async function loadCatalog(){
 const {data:rows,error}=await db.from('catalogo').select('id,nombre,categoria').order('categoria').order('nombre');
 if(error){catalogReady=false;adminMessage('El catálogo editable requiere ejecutar el archivo configurar_supabase.sql una sola vez. '+error.message);}
 else{catalogRows=rows||[];catalogReady=true;adminMessage('');}
 if(adminMode)renderAdmin();
}
function makeAdminRow(item,type){
 const row=document.createElement('div');row.className='admin-row';
 const label=document.createElement('div');label.className='admin-label';
 const name=document.createElement('strong');name.textContent=type==='food'?item.name:item.nombre;
 const cat=document.createElement('small');cat.textContent=type==='food'?item.category:item.categoria;
 label.append(name,cat);
 const actions=document.createElement('div');actions.className='admin-actions';
 const edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='Editar';
 const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Eliminar';
 actions.append(edit,del);row.append(label,actions);
 edit.onclick=()=>{
  if(row.querySelector('.admin-edit')){row.querySelector('.admin-edit').remove();return;}
  const form=document.createElement('form');form.className='admin-edit';form.style.gridColumn='1/-1';
  const n=document.createElement('input');n.required=true;n.maxLength=100;n.value=type==='food'?item.name:item.nombre;n.setAttribute('aria-label','Nombre del alimento');
  const c=document.createElement('input');c.required=true;c.maxLength=120;c.value=type==='food'?item.category:item.categoria;c.setAttribute('list','adminCategories');c.setAttribute('aria-label','Categoría');
  const save=document.createElement('button');save.type='submit';save.textContent='Guardar cambios';form.append(n,c,save);row.append(form);
  form.onsubmit=async e=>{e.preventDefault();const nombre=n.value.trim(),categoria=c.value.trim();if(!nombre||!categoria)return;save.disabled=true;
   const table=type==='food'?'alimentos':'catalogo';const {error}=await db.from(table).update({nombre,categoria}).eq('id',item.id);
   if(error){adminMessage('Error: '+error.message);save.disabled=false;return;}
   await refresh();if(type==='catalog')await loadCatalog();adminMessage('Cambios guardados.');};
 };
 del.onclick=async()=>{if(!confirm('¿Eliminar «'+(type==='food'?item.name:item.nombre)+'» '+(type==='food'?'de la despensa':'del catálogo')+'?'))return;
  del.disabled=true;const {error}=await db.from(type==='food'?'alimentos':'catalogo').delete().eq('id',item.id);
  if(error){adminMessage('Error: '+error.message);del.disabled=false;return;}
  await refresh();if(type==='catalog')await loadCatalog();adminMessage('Alimento eliminado.');};
 return row;
}

 const foods=$('adminFoods');foods.replaceChildren();renderGroupedAdmin(foods,data,'food',foodQ);

}

$('dedup').onclick=async()=>{
 const groups=new Map();for(const x of data){const k=x.name.trim().toLocaleLowerCase('es')+'|'+x.category.trim().toLocaleLowerCase('es');(groups.get(k)||groups.set(k,[]).get(k)).push(x)}
 const dup=[...groups.values()].filter(g=>g.length>1);const extra=dup.reduce((n,g)=>n+g.length-1,0);
 if(!extra){adminMessage('No hay duplicados por nombre y categoría.');return;}
 if(!confirm('Se eliminarán '+extra+' registros duplicados. Se conservará una copia por nombre y categoría y la marca «Ya tengo» si alguna copia la tiene. ¿Continuar?'))return;
 $('dedup').disabled=true;let removed=0;
 for(const group of dup){const keep=group.find(x=>x.have)||group[0];if(group.some(x=>x.have)&&!keep.have){const {error}=await db.from('alimentos').update({disponible:true}).eq('id',keep.id);if(error){adminMessage(error.message);break;}}
  for(const x of group){if(x.id===keep.id)continue;const {error}=await db.from('alimentos').delete().eq('id',x.id);if(error){adminMessage('Limpieza interrumpida: '+error.message);await refresh();$('dedup').disabled=false;return;}removed++;}
 }
 await refresh();$('dedup').disabled=false;adminMessage('Duplicados eliminados: '+removed+'.');
};
