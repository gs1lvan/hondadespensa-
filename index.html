<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06192e"><title>HondaDespensa · prototipo</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;color:#fff;background:#06192e url('textura-azul.jpg') repeat;background-size:512px}.app{max-width:920px;margin:auto;padding:14px 14px 70px}.mast{display:grid;grid-template-columns:90px minmax(0,1fr) 158px;gap:10px;align-items:center;min-height:128px}.photo{width:87px;height:111px;padding:6px 6px 14px;background:#f9f7ef;transform:rotate(-6deg);box-shadow:2px 8px 12px #000a;position:relative}.photo:before{content:'';position:absolute;width:65px;height:19px;background:#c9a86cdd;top:-9px;left:9px;transform:rotate(3deg);box-shadow:0 1px 3px #0006}.photo-inner{width:100%;height:100%;background:linear-gradient(#69c2fa 0 42%,#fff3d9 42% 46%,#0c7cc1 46% 64%,#e8cf9d 64%);display:grid;place-items:center;font-size:32px}.brand{min-width:0}.brand strong{font-size:clamp(20px,4.3vw,43px);font-style:italic;letter-spacing:-1.6px;white-space:nowrap;text-shadow:0 3px 4px #0008}.brand strong em{font-style:italic;color:#92d8ff}.wave{height:8px;margin:2px 12% 0 2%;background:#06b7fa;border-radius:60% 40% 70% 40%;transform:skewY(-2deg)}button,input{font:inherit}.account{display:grid;gap:9px}.account button,.tile,.search,.filter,.item,.sort{color:white;background:linear-gradient(155deg,#1b3a58,#091d32);border:2px solid #436583;box-shadow:inset 0 1px #ffffff25,0 6px 10px #0007;border-radius:19px}.account button{font-size:12px;font-weight:700;padding:11px 4px;white-space:nowrap}.tear{height:29px;margin:6px -14px 0;background:linear-gradient(178deg,transparent 0 31%,#f1eee6 32% 42%,#b9ada0 43% 49%,transparent 50%);filter:drop-shadow(0 4px 2px #0009)}.pull{width:45px;height:65px;margin:-18px auto 14px;border:8px solid #c6cdd0;border-radius:50% 50% 45% 45%;transform:rotate(22deg);box-shadow:inset 0 0 0 3px #69727a,0 4px 5px #0009;position:relative;background:linear-gradient(120deg,#525a60,#e5e9e9 60%,#606a72)}.pull:after{content:'';position:absolute;left:7px;right:7px;top:9px;height:20px;border-radius:50%;background:#071a2e;box-shadow:inset 0 2px 4px #000}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 22px}.tile{min-height:98px;padding:12px 3px;font-size:clamp(10px,2.7vw,15px);font-weight:700;cursor:pointer}.tile svg{width:35px;height:35px;display:block;margin:0 auto 8px;stroke:#fff;fill:none;stroke-width:2.4}.tile.active,.sort,.plus{background:linear-gradient(145deg,#07a5ff,#0051ba);border-color:#24c0ff}.tools{display:flex;gap:9px;margin:15px 0 30px}.search{flex:1;min-width:0;padding:15px;color:#fff;outline:none;font-size:14px}.search::placeholder{color:#b7cde1}.filter{padding:10px 15px;cursor:pointer}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.heading h2{margin:0;font-size:clamp(19px,4vw,28px)}.sort{padding:10px 12px;font-size:13px;font-weight:700;border-radius:14px}.item{display:flex;align-items:center;gap:11px;margin:10px 0;padding:10px 11px;position:relative;overflow:hidden;min-height:94px}.item:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:#8be65b}.item.warn:before{background:#ffb52a}.can{width:69px;height:68px;flex:none;filter:drop-shadow(1px 4px 3px #0009)}.name{min-width:0;flex:1}.name strong{display:block;font-size:clamp(14px,3.8vw,22px);margin-bottom:7px}.name small{display:flex;align-items:center;gap:9px;color:#cbdcec;font-size:clamp(10px,2.5vw,14px);flex-wrap:wrap}.qty{border-radius:40px;background:linear-gradient(#466d9c,#254971);padding:4px 10px;color:#fff;font-weight:700;white-space:nowrap}.actions{display:flex;gap:6px}.actions button{border:1px solid #2c9cff;border-radius:12px;background:#0a4a95;color:#fff;font-size:21px;padding:7px;cursor:pointer}.actions .del{background:#692028;border-color:#ff4653}.plus{display:block;float:right;border:2px solid #42caff;border-radius:50%;width:70px;height:70px;color:white;font-size:46px;cursor:pointer;margin:14px 3px}.cloth{clear:both;width:42%;height:42px;margin:100px 0 -60px -14px;background:repeating-conic-gradient(#e5eced 0 25%,#2c5c83 0 50%) 50%/28px 28px;clip-path:polygon(0 0,100% 20%,94% 100%,0 80%);transform:rotate(8deg)}.note{font-size:12px;color:#aec9e1;margin:15px 0}.hidden{display:none!important}@media(max-width:530px){.mast{grid-template-columns:67px minmax(0,1fr) 116px;gap:6px;min-height:104px}.photo{width:61px;height:78px;padding:4px 4px 10px}.photo:before{width:49px;height:14px}.photo-inner{font-size:23px}.brand strong{font-size:clamp(16px,4.5vw,24px);letter-spacing:-.8px}.account button{font-size:10px;padding:9px 1px}.nav{gap:6px}.tile{min-height:85px}.tile svg{width:27px;height:27px}.can{width:53px;height:53px}.item{gap:7px;min-height:80px;padding:8px 7px}.actions{gap:4px}.actions button{padding:5px;font-size:16px}}
</style></head><body><div class="app"><header class="mast"><div class="photo"><div class="photo-inner">🏖️</div></div><div class="brand"><strong><em>Honda</em>Despensa</strong><div class="wave"></div></div><div class="account"><button type="button">◉ Usuario ⌄</button><button type="button">⚙ Administración</button></div></header><div class="tear"></div><div class="pull"></div><nav class="nav"><button class="tile active"><svg viewBox="0 0 40 40"><ellipse cx="20" cy="8" rx="14" ry="5"/><path d="M6 8v24c0 7 28 7 28 0V8M6 21c0 7 28 7 28 0"/></svg>Inventario</button><button class="tile" onclick="document.querySelector('.plus').click()"><svg viewBox="0 0 40 40"><path d="M20 4v32M4 20h32"/></svg>Añadir</button><button class="tile"><svg viewBox="0 0 40 40"><path d="m4 12 16-8 16 8-16 8zm0 9 16 8 16-8M4 30l16 8 16-8"/></svg>Productos</button><button class="tile"><svg viewBox="0 0 40 40"><circle cx="20" cy="11" r="7"/><path d="M7 34c0-17 26-17 26 0M4 13c-6 0-6 12 0 12m32-12c6 0 6 12 0 12"/></svg>Usuarios</button></nav><div class="tools"><input class="search" placeholder="⌕  Buscar en el inventario…" oninput="filterItems(this.value)"><button class="filter" onclick="alert('Vista previa de diseño')">▽</button></div><div class="heading"><h2>▤ Inventario <span id="count">(4)</span></h2><button class="sort" onclick="sortItems()">Caducidad ↕</button></div><main id="list"></main><button class="plus" aria-label="Añadir producto" onclick="addItem()">+</button><div class="cloth"></div><p class="note">Prototipo visual con datos de ejemplo. No está conectado a tu inventario real.</p></div><script>
const data=[{n:'Atún en lata',q:6,d:'2027-03-15',c:'#2278c7',art:'🐟'},{n:'Lentejas cocidas',q:4,d:'2027-04-30',c:'#bd7629',art:'🫘'},{n:'Tomate triturado',q:3,d:'2027-06-12',c:'#d42c2b',art:'🍅'},{n:'Maíz dulce',q:2,d:'2028-02-01',c:'#74ad25',art:'🌽'}];let reverse=false;function can(item){return `<svg class="can" viewBox="0 0 76 76" aria-hidden="true"><defs><linearGradient id="metal" x2="1"><stop stop-color="#657a85"/><stop offset=".3" stop-color="#f3f7f8"/><stop offset=".7" stop-color="#869ca5"/><stop offset="1" stop-color="#e3e8e8"/></linearGradient></defs><rect x="8" y="13" width="60" height="51" rx="7" fill="url(#metal)"/><rect x="11" y="24" width="54" height="34" rx="2" fill="${item.c}"/><ellipse cx="38" cy="14" rx="30" ry="9" fill="url(#metal)" stroke="#526574" stroke-width="2"/><ellipse cx="38" cy="14" rx="23" ry="5" fill="#8098a5" stroke="#eef4f6" stroke-width="2"/><ellipse cx="38" cy="64" rx="30" ry="6" fill="url(#metal)"/><text x="38" y="48" font-size="24" text-anchor="middle">${item.art}</text></svg>`}function render(){let q=document.querySelector('.search').value.toLocaleLowerCase();let arr=data.filter(x=>x.n.toLocaleLowerCase().includes(q));document.querySelector('#count').textContent='('+arr.length+')';document.querySelector('#list').innerHTML=arr.map((x)=>`<article class="item"><div>${can(x)}</div><div class="name"><strong>${x.n}</strong><small><span class="qty">${x.q} uds</span> ▢ Caduca: ${x.d.split('-').reverse().join('/')}</small></div><div class="actions"><button title="Editar" onclick="editItem('${x.n}')">✎</button><button title="Eliminar" class="del" onclick="deleteItem('${x.n}')">♜</button></div></article>`).join('')}function filterItems(){render()}function sortItems(){reverse=!reverse;data.sort((a,b)=>reverse?b.d.localeCompare(a.d):a.d.localeCompare(b.d));render()}function addItem(){const n=prompt('Nombre del producto');if(n&&n.trim()){data.push({n:n.trim(),q:1,d:'2028-12-31',c:'#3d8bc0',art:'🥫'});render()}}function editItem(n){let x=data.find(x=>x.n===n),v=prompt('Cantidad de '+n,x.q);if(v!==null&&Number.isFinite(+v)&&+v>=0){x.q=+v;render()}}function deleteItem(n){if(confirm('¿Eliminar '+n+' de la vista previa?')){data.splice(data.findIndex(x=>x.n===n),1);render()}}render();</script></body></html>
