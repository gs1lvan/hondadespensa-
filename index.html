<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HondaDespensa</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172c26;background:#f3f6f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px 14px 60px}header{background:#194e3e;color:white;padding:24px;border-radius:20px}h1{margin:0;font-size:26px}header p{opacity:.85;margin:8px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:white;border-radius:14px;padding:16px;text-align:center}.stat b{font-size:27px;display:block}.stat small{color:#64736c}.toolbar,.add{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.toolbar input,.toolbar select,.add input,.add select{border:1px solid #cad8cf;border-radius:10px;padding:12px;font:inherit;background:white;min-width:0;flex:1}.toolbar input{flex:2}button{border:0;border-radius:10px;padding:11px 14px;background:#27634e;color:white;font:inherit;cursor:pointer}button.secondary{background:#e2ece5;color:#194e3e}button.danger{background:#fff0ed;color:#9c372c}.category{background:white;border-radius:16px;margin:12px 0;overflow:hidden}.category summary{font-size:17px;font-weight:700;padding:16px;background:#e8f0e9;display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}.category summary::-webkit-details-marker{display:none}.category summary:after{content:"⌄";margin-left:10px}.category[open] summary:after{content:"⌃"}.category summary:focus-visible{outline:3px solid #267654;outline-offset:-3px}.category summary small{font-weight:400;color:#52695c}.item{display:flex;align-items:center;gap:12px;padding:11px 15px;border-top:1px solid #eef1ed}.item input{width:20px;height:20px;accent-color:#267654}.item span{flex:1;overflow-wrap:anywhere}.item.done span{text-decoration:line-through;color:#7e8c83}.item button{padding:5px 9px;font-size:14px}h3{margin:22px 0 8px}.notice{font-size:13px;color:#61716a}.empty{text-align:center;padding:28px;color:#67756b}#file{display:none}@media(max-width:500px){.stats{gap:6px}.stat{padding:12px 6px}.stat b{font-size:23px}.add input,.add select{flex-basis:100%}header{padding:20px}}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#194e3e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body><div class="wrap"><header><h1>🏖️ HondaDespensa</h1></header><section class="stats"><div class="stat"><b id="total">0</b><small>Productos</small></div><div class="stat"><b id="have">0</b><small>Ya tengo</small></div><div class="stat"><b id="missing">0</b><small>Me faltan</small></div></section><div class="toolbar"><input id="search" placeholder="🔎 Buscar alimentos…" aria-label="Buscar alimentos"><select id="filter"><option value="all">Todos</option><option value="have">Ya tengo</option><option value="missing">Me faltan</option></select></div><h3>➕ Añadir alimento</h3><form id="addForm" class="add"><input id="newName" placeholder="Nombre del alimento" required maxlength="100"><select id="newCategory"></select><button type="submit">Añadir</button></form><main id="items"></main></div><script>
const initial={
'🥛 Leche, desayunos y bebidas':['Leche UHT entera','Leche UHT semidesnatada','Leche sin lactosa UHT','Leche en polvo','Leche condensada','Bebidas vegetales UHT','Café soluble','Café molido al vacío','Café en cápsulas','Té','Infusiones','Cacao soluble','Chocolate negro','Cereales de desayuno','Copos de avena','Galletas','Mermelada','Miel'],
'🫒 Aceites y vinagres':['Aceite de oliva virgen extra','Aceite de oliva refinado','Aceite de girasol','Aceite de coco','Aceite de sésamo','Vinagre de vino','Vinagre de manzana','Vinagre balsámico'],
'🍅 Salsas y aderezos':['Ketchup','Mostaza','Salsa de soja','Salsa barbacoa','Salsa Worcestershire (Perrins)','Tabasco','Salsa picante','Salsa teriyaki','Salsa agridulce','Mayonesa industrial','Tomate frito','Tomate triturado','Tomate concentrado','Salsa de tomate para pasta'],
'🌿 Especias y condimentos':['Sal','Pimienta negra','Pimienta blanca','Pimentón dulce','Pimentón picante','Comino','Curry','Cúrcuma','Orégano','Tomillo','Romero','Albahaca seca','Perejil seco','Laurel','Ajo en polvo','Cebolla en polvo','Canela','Nuez moscada','Jengibre en polvo','Azafrán','Hierbas provenzales','Caldo concentrado en pastillas'],
'🍚 Arroz, pasta y cereales':['Arroz blanco','Arroz basmati','Arroz integral','Pasta seca','Fideos','Cuscús','Quinoa','Bulgur','Avena','Sémola de trigo','Puré de patatas en copos','Fideos instantáneos'],
'🫘 Legumbres y proteínas vegetales':['Garbanzos secos','Lentejas secas','Alubias secas','Soja seca','Soja texturizada','Garbanzos cocidos en conserva','Lentejas cocidas en conserva','Alubias cocidas en conserva','Guisantes en conserva','Edamame en conserva'],
'🐟 Pescados y mariscos en conserva':['Atún al natural','Atún en aceite','Sardinas en aceite','Caballa en conserva','Bonito del norte','Melva en conserva','Mejillones en escabeche','Berberechos al natural','Almejas en conserva','Anchoas en aceite','Calamares en conserva','Pulpo en conserva'],
'🥩 Carnes y platos preparados':['Pollo en conserva','Ternera en conserva','Cerdo en conserva','Paté en lata esterilizado','Albóndigas en lata','Fabada en conserva','Cocido madrileño en conserva','Callos en conserva','Lentejas preparadas','Garbanzos con espinacas','Sopas en lata','Cremas de verduras en brick','Caldos en brick'],
'🥕 Verduras y encurtidos':['Maíz dulce en conserva','Guisantes en conserva','Judías verdes en conserva','Zanahorias en conserva','Espárragos en conserva','Pimientos asados en conserva','Champiñones en conserva','Alcachofas en conserva','Aceitunas','Pepinillos en vinagre','Cebollitas en vinagre','Remolacha en conserva','Tomates secos envasados','Verduras deshidratadas'],
'🥜 Frutos secos y aperitivos':['Almendras','Nueces','Avellanas','Cacahuetes tostados','Pistachos','Anacardos','Semillas de calabaza','Semillas de girasol','Semillas de chía','Semillas de sésamo','Crema de cacahuete','Barritas proteicas','Patatas fritas de bolsa','Maíz para palomitas','Fruta deshidratada'],
'🍞 Harinas y repostería':['Harina de trigo blanca','Harina de maíz','Maicena','Pan rallado','Azúcar blanco','Azúcar moreno','Levadura química','Levadura seca de panadería','Bicarbonato','Gelatina en polvo','Cacao puro en polvo','Coco rallado','Esencia de vainilla','Sirope de chocolate'],
'🧃 Bebidas y suplementos':['Agua mineral','Refrescos en lata','Zumos UHT','Bebidas isotónicas','Batidos proteicos UHT','Bebidas de cacao UHT','Proteína en polvo']};
const KEY='despensa_segunda_vivienda_v1';let data;const openCategories=new Set();try{let saved=JSON.parse(localStorage.getItem(KEY));data=Array.isArray(saved)?saved:null}catch{}if(!data)data=Object.entries(initial).flatMap(([category,names])=>names.map((name,i)=>({id:crypto.randomUUID(),category,name,have:false})));const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){let q=$('search').value.trim().toLocaleLowerCase('es'),f=$('filter').value;$('total').textContent=data.length;$('have').textContent=data.filter(x=>x.have).length;$('missing').textContent=data.filter(x=>!x.have).length;let shown=data.filter(x=>x.name.toLocaleLowerCase('es').includes(q)&&(f==='all'||(f==='have'?x.have:!x.have)));let main=$('items');main.replaceChildren();if(!shown.length){let p=document.createElement('p');p.className='empty';p.textContent='No hay alimentos con este filtro.';main.append(p)}for(let category of [...new Set(data.map(x=>x.category))]){let arr=shown.filter(x=>x.category===category);if(!arr.length)continue;let section=document.createElement('details');section.className='category';section.open=openCategories.has(category);section.addEventListener('toggle',()=>{if(section.open)openCategories.add(category);else openCategories.delete(category)});let h=document.createElement('summary');let title=document.createElement('span');title.textContent=category;h.append(title);let count=document.createElement('small');count.textContent=`${arr.filter(x=>x.have).length}/${arr.length}`;h.append(count);section.append(h);for(let x of arr){let row=document.createElement('div');row.className='item'+(x.have?' done':'');let check=document.createElement('input');check.type='checkbox';check.checked=x.have;check.setAttribute('aria-label','Tengo '+x.name);check.onchange=()=>{x.have=check.checked;save();render()};let span=document.createElement('span');span.textContent=x.name;let del=document.createElement('button');del.className='danger';del.textContent='Eliminar';del.setAttribute('aria-label','Eliminar '+x.name);del.onclick=()=>{if(confirm('¿Eliminar «'+x.name+'» de la lista?')){data=data.filter(y=>y.id!==x.id);save();render()}};row.append(check,span,del);section.append(row)}main.append(section)}}function categories(){let sel=$('newCategory'),old=sel.value;sel.replaceChildren();for(let c of [...new Set([...Object.keys(initial),...data.map(x=>x.category)])]){let o=document.createElement('option');o.value=c;o.textContent=c;sel.append(o)}if(old)sel.value=old}categories();$('addForm').onsubmit=e=>{e.preventDefault();let name=$('newName').value.trim(),category=$('newCategory').value;if(!name)return;if(data.some(x=>x.name.toLocaleLowerCase('es')===name.toLocaleLowerCase('es')&&x.category===category)){alert('Ese alimento ya está en la categoría.');return}data.push({id:crypto.randomUUID(),name,category,have:false});$('newName').value='';save();render()};$('search').oninput=render;$('filter').onchange=render;save();render();</script><script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));}</script></body></html>
