name: Integridad PWA

on:
  pull_request:
  push:
    branches:
      - "auditoria/**"
      - "lite/**"

permissions:
  contents: read

jobs:
  smoke:
    name: Comprobaciones estáticas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Usar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ejecutar smoke tests
        run: node --test tests/quality-smoke.test.mjs
